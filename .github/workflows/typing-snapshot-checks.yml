name: Typing snapshot checks

on:
  push:
    branches: [test/typing-snapshot-20260925]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  contracts:
    name: ${{ matrix.snapshot }} contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        snapshot: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select baseline with current regression tests
        if: matrix.snapshot == 'baseline'
        run: |
          candidate_commit=$(git rev-parse HEAD)
          git checkout --detach "$(git rev-list --max-parents=0 HEAD)"
          git checkout "$candidate_commit" -- \
            tests/unit_test/cpu/test_data_ref_schema.py \
            tests/unit_test/typing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: >-
          python -m pip install
          msgspec==0.21.1 pydantic==2.13.5 typing-extensions==4.16.0
          pytest==9.1.1 PyYAML==6.0.3 pyrefly==1.3.1
      - name: Schema generation
        run: python -m pytest -q --tb=short tests/unit_test/cpu/test_data_ref_schema.py 2>&1 | tee schema.log
      - name: Dataclass field typing
        if: always()
        run: >-
          pyrefly check --python-interpreter-path "$(command -v python)"
          --python-version 3.12 --preset default --output-format min-text
          tests/unit_test/typing/wire_contract.py 2>&1 | tee wire.log
      - name: Scheduler request typing
        if: always()
        run: >-
          pyrefly check --python-interpreter-path "$(command -v python)"
          --python-version 3.12 --preset default --output-format min-text
          tests/unit_test/typing/scheduler_contract.py 2>&1 | tee scheduler.log
      - name: Configuration and encoder unit tests
        if: always()
        run: |
          python -m pytest -q \
            tests/unit_test/config/test_config_path.py \
            tests/unit_test/config/test_config_resolver.py \
            tests/unit_test/config/test_config_patch.py \
            tests/unit_test/scheduling/test_pre_lm_encoder.py 2>&1 | tee unit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.snapshot }}-logs
          path: '*.log'
